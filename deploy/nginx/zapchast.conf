# HTTP bootstrap. Certbot adds the TLS listener and HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name zapchast.king.tj;
    root /srv/zapchast/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location ~ /\. { deny all; }
    location /api/ { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /health { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /ready { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /robots.txt { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /sitemap.xml { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location /seo/ { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location /assets/ {
        # Do not cache missing files or return SPA HTML for missing JS/CSS.
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
