# Dedicated domain only; does not replace any existing site's virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name zapchast.king.tj;
    location ^~ /.well-known/acme-challenge/ { root /var/www/zapchast-acme; }
    location / { return 301 https://zapchast.king.tj$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zapchast.king.tj;
    ssl_certificate /etc/letsencrypt/live/zapchast.king.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapchast.king.tj/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZapchastTLS:1m;
    ssl_session_timeout 1d;
    root /srv/zapchast/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { deny all; }
    location /api/ { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /health { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /ready { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /robots.txt { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location = /sitemap.xml { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location /seo/ { include /etc/nginx/snippets/zapchast-proxy.conf; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
